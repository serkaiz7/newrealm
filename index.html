<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Viewport Guard: Prevents pinch-zoom, double-tap zoom, and mobile scaling artifacts -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ASCII Voxel Heightmap</title>
  <style>
    /* Reset & Touch Guard: Eliminates gestures, elastic bouncing, and pull-to-refresh */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060814;
      touch-action: none;
      position: fixed;
      font-family: monospace;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Minimalist HUD overlay */
    #hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      color: #9cb3d9;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 1px 1px 2px #000;
      z-index: 10;
    }

    #controls-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 10px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 1.5s ease-out;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-left">VOXEL-ASCII // FPS: --</div>
    <div id="hud-center">HEADING: [ N ]</div>
    <div id="hud-right">POS: (0, 0) | ALT: 0m</div>
  </div>
  <div id="controls-hint">TOUCH: Left = Move, Right = Look | DESKTOP: WASD / Drag to Look</div>
  <canvas id="game-canvas"></canvas>

  <script>
    /* ==========================================================================
       1. ENGINE ARCHITECTURE & CONFIGURATION
       ========================================================================== */
    const MAP_SIZE = 512;          // 512x512 heightmap grid
    const MAP_MASK = MAP_SIZE - 1; // Bitwise mask for seamless map wrapping
    const WATER_LEVEL = 28.0;      // Water surface baseline altitude
    const FOV = 1.15;              // Field of view (~66 degrees)

    // Lighting vector: Directional sun pointing down from South-West
    const SUN_DIR = normalizeVector({ x: -0.55, y: -0.65, z: 0.52 });

    // Canvas & Screen Grid state
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let screenW = 0, screenH = 0;
    let cols = 0, rows = 0;
    let cellW = 0, cellH = 0;

    // Raycast text buffers (flattened 1D arrays: index = r * cols + c)
    let charBuffer = [];
    let colorBuffer = [];

    // Player state
    const player = {
      x: 256.0,
      y: 256.0,
      z: 60.0,
      targetZ: 60.0,
      yaw: 0.0,       // Horizontal rotation in radians
      pitch: 0.0,     // Horizon pitch offset (-0.45 to 0.45)
      speed: 36.0,    // Movement units per second
      eyeHeight: 5.5
    };

    /* ==========================================================================
       2. PROCEDURAL TERRAIN GENERATION (Multi-Octave Value Noise)
       ========================================================================== */
    const heightMap = new Float32Array(MAP_SIZE * MAP_SIZE);

    // Deterministic pseudo-random noise generator
    function createNoise2D(seed = 42) {
      const p = new Uint8Array(512);
      for (let i = 0; i < 256; i++) p[i] = i;
      let s = seed;
      for (let i = 255; i > 0; i--) {
        s = (s * 16807 + 7) % 2147483647;
        const j = s % (i + 1);
        const t = p[i]; p[i] = p[j]; p[j] = t;
      }
      for (let i = 0; i < 256; i++) p[256 + i] = p[i];

      return function(x, y) {
        const xi = Math.floor(x) & 255;
        const yi = Math.floor(y) & 255;
        const xf = x - Math.floor(x);
        const yf = y - Math.floor(y);
        // Quintic S-curve smoothstep
        const u = xf * xf * xf * (xf * (xf * 6.0 - 15.0) + 10.0);
        const v = yf * yf * yf * (yf * (yf * 6.0 - 15.0) + 10.0);

        const a1 = p[p[xi] + yi];
        const a2 = p[p[xi] + yi + 1];
        const b1 = p[p[xi + 1] + yi];
        const b2 = p[p[xi + 1] + yi + 1];

        // Pseudo-random gradient projection
        function grad(hash, gx, gy) {
          const h = hash & 3;
          return ((h & 1) ? -gx : gx) + ((h & 2) ? -gy : gy);
        }

        const x1 = grad(a1, xf, yf) * (1.0 - u) + grad(b1, xf - 1.0, yf) * u;
        const x2 = grad(a2, xf, yf - 1.0) * (1.0 - u) + grad(b2, xf - 1.0, yf - 1.0) * u;
        return x1 * (1.0 - v) + x2 * v;
      };
    }

    function generateWorld() {
      const noise = createNoise2D(777);
      for (let y = 0; y < MAP_SIZE; y++) {
        const rowOffset = y * MAP_SIZE;
        for (let x = 0; x < MAP_SIZE; x++) {
          // Multi-octave Fractal Brownian Motion (fBm)
          let h = 0;
          h += noise(x * 0.005, y * 0.005) * 85.0; // Continental landmasses
          h += noise(x * 0.012, y * 0.012) * 40.0; // Rolling hills
          h += noise(x * 0.030, y * 0.030) * 16.0; // Ridge crags
          h += noise(x * 0.070, y * 0.070) * 5.0;  // Local rock bumps
          h += 52.0; // Baseline shift

          // Mountain peak shaping: exponential steepening above tree-line
          if (h > 65.0) {
            h += Math.pow((h - 65.0) * 0.04, 2.3) * 35.0;
          }
          heightMap[rowOffset + x] = Math.max(0, h);
        }
      }

      // Safe spawn search: locate scenic highland meadow
      for (let y = 100; y < 400; y += 4) {
        for (let x = 100; x < 400; x += 4) {
          const h = sampleTerrain(x, y);
          if (h > WATER_LEVEL + 10.0 && h < 75.0) {
            player.x = x;
            player.y = y;
            player.z = h + player.eyeHeight;
            player.targetZ = player.z;
            return;
          }
        }
      }
    }

    function sampleTerrain(x, y) {
      const ix = Math.floor(x) & MAP_MASK;
      const iy = Math.floor(y) & MAP_MASK;
      return heightMap[iy * MAP_SIZE + ix];
    }

    function normalizeVector(v) {
      const len = Math.hypot(v.x, v.y, v.z) || 1.0;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }

    /* ==========================================================================
       3. LIGHTING & SURFACE NORMAL ENGINE
       ========================================================================== */
    // Computes normal and directional lighting on-the-fly via finite differences
    function computeLighting(mx, my, isWater) {
      if (isWater) {
        // Water has an upward-facing normal with subtle specular bounce
        return 0.88;
      }
      const x = Math.floor(mx) & MAP_MASK;
      const y = Math.floor(my) & MAP_MASK;

      const hL = heightMap[y * MAP_SIZE + ((x - 1) & MAP_MASK)];
      const hR = heightMap[y * MAP_SIZE + ((x + 1) & MAP_MASK)];
      const hU = heightMap[(((y - 1) & MAP_MASK) * MAP_SIZE) + x];
      const hD = heightMap[(((y + 1) & MAP_MASK) * MAP_SIZE) + x];

      // Slope gradients
      const dx = (hR - hL) * 0.5;
      const dy = (hD - hU) * 0.5;

      // Surface normal: N = (-dx, -dy, 1.0)
      const len = Math.hypot(dx, dy, 1.0);
      const nx = -dx / len;
      const ny = -dy / len;
      const nz = 1.0 / len;

      // Dot product with sun direction
      const dot = nx * SUN_DIR.x + ny * SUN_DIR.y + nz * SUN_DIR.z;
      // Ambient lighting baseline (0.22) + diffuse direct sun
      return Math.max(0.18, Math.min(1.0, dot * 0.65 + 0.42));
    }

    /* ==========================================================================
       4. MATERIAL & ASCII GLYPH SHADING PIPELINE
       ========================================================================== */
    function getVoxelVisual(h, d, maxD, light, isWater, animTime) {
      // Depth fog factor (exponential falloff)
      const fog = Math.min(1.0, Math.pow(d / maxD, 1.6));
      let char = '░';
      let r = 0, g = 0, b = 0;

      if (isWater) {
        // Water: animated waves using Unicode ripples
        const wave = Math.sin(animTime * 3.5 + d * 0.3);
        char = wave > 0.3 ? '~' : (wave > -0.3 ? '≈' : '-');
        r = 24; g = 75; b = 160;
      } else if (h < WATER_LEVEL + 5.0) {
        // Sand / Shoreline
        char = light > 0.5 ? ':' : '.';
        r = 185; g = 165; b = 105;
      } else if (h < 75.0) {
        // Grass / Lowland Plains
        const dense = light * (1.0 - fog * 0.5);
        char = dense > 0.7 ? 'w' : (dense > 0.4 ? 'v' : (dense > 0.2 ? ',' : '.'));
        r = 45; g = 135; b = 50;
      } else if (h < 115.0) {
        // Rocky Crags & Cliffs
        char = light > 0.65 ? '#' : (light > 0.4 ? '%' : ':');
        r = 110; g = 105; b = 100;
      } else {
        // Mountain Peaks / Snow Caps
        char = light > 0.7 ? '█' : (light > 0.45 ? '▓' : '▒');
        r = 220; g = 230; b = 245;
      }

      // Apply directional lighting
      r = Math.floor(r * light);
      g = Math.floor(g * light);
      b = Math.floor(b * light);

      // Distance fog blending towards deep atmosphere color (#060814 -> [6, 8, 20])
      r = Math.floor(r * (1.0 - fog) + 6.0 * fog);
      g = Math.floor(g * (1.0 - fog) + 8.0 * fog);
      b = Math.floor(b * (1.0 - fog) + 20.0 * fog);

      // Distant geometry fades into sparser dithering glyphs
      if (fog > 0.78) char = '░';
      if (fog > 0.92) char = '.';

      return { char, color: `rgb(${r},${g},${b})` };
    }

    /* ==========================================================================
       5. VOXEL SPACE RAYCASTING ENGINE
       ========================================================================== */
    function renderRaycastScene(time) {
      const maxDist = 240.0;
      const verticalScale = rows * 1.05;
      const horizonY = rows * (0.45 + player.pitch);

      // Clear text grid with blank sky characters
      const totalCells = cols * rows;
      for (let i = 0; i < totalCells; i++) {
        charBuffer[i] = ' ';
        colorBuffer[i] = '#060814';
      }

      // Render column-by-column across screen width
      for (let c = 0; c < cols; c++) {
        // Camera ray angle for column c
        const screenU = (c / (cols - 1)) - 0.5; // [-0.5, 0.5]
        const rayAngle = player.yaw + screenU * FOV;
        const cosA = Math.cos(rayAngle);
        const sinA = Math.sin(rayAngle);

        // Fish-eye lens correction factor
        const fishEye = Math.cos(screenU * FOV);

        // Height occlusion barrier: tracks highest projected pixel on screen
        let maxHeight = rows;

        // Progressive distance ray-marching (near -> far)
        // Step size grows with distance for optimal performance & level-of-detail
        let d = 1.2;
        while (d < maxDist) {
          const dStep = 0.5 + d * 0.017;
          d += dStep;

          const mx = (player.x + cosA * d) & MAP_MASK;
          const my = (player.y + sinA * d) & MAP_MASK;
          let h = heightMap[my * MAP_SIZE + mx];

          // Water surface clipping & ripple offset
          let isWater = false;
          if (h < WATER_LEVEL) {
            h = WATER_LEVEL + Math.sin(mx * 0.2 + my * 0.15 + time * 3.0) * 0.35;
            isWater = true;
          }

          // 3D Voxel Space projection equation:
          // screenY = (CameraHeight - VoxelHeight) / CorrectedDistance * Scale + Horizon
          const correctedDist = d * fishEye;
          const projY = Math.floor((player.z - h) / correctedDist * verticalScale + horizonY);

          // If current terrain height projects above the occluder, it is visible!
          if (projY < maxHeight) {
            const yStart = Math.max(0, projY);
            const yEnd = Math.min(rows, maxHeight);

            if (yStart < yEnd) {
              const light = computeLighting(mx, my, isWater);
              const visual = getVoxelVisual(h, d, maxDist, light, isWater, time);

              for (let y = yStart; y < yEnd; y++) {
                const idx = y * cols + c;
                charBuffer[idx] = visual.char;
                colorBuffer[idx] = visual.color;
              }
            }
            // Update highest drawn height
            maxHeight = projY;

            // Early ray termination: column fully occluded to the top of screen
            if (maxHeight <= 0) break;
          }
        }

        // Sky rendering above terrain occlusion
        const sunAngleOffset = Math.atan2(SUN_DIR.y, SUN_DIR.x);
        let dSunYaw = (rayAngle - sunAngleOffset) % (Math.PI * 2);
        if (dSunYaw < -Math.PI) dSunYaw += Math.PI * 2;
        if (dSunYaw > Math.PI) dSunYaw -= Math.PI * 2;

        const isNearSunColumn = Math.abs(dSunYaw) < 0.14;
        const sunCenterRow = Math.floor(horizonY - SUN_DIR.z * rows * 0.8);

        for (let y = 0; y < Math.min(rows, maxHeight); y++) {
          const idx = y * cols + c;
          // Sun disc & coronal glow
          if (isNearSunColumn && Math.abs(y - sunCenterRow) < 2) {
            charBuffer[idx] = (Math.abs(y - sunCenterRow) === 0 && Math.abs(dSunYaw) < 0.06) ? '☼' : '*';
            colorBuffer[idx] = '#ffe494';
          } else {
            // Atmospheric stars & twilight dither
            const starHash = (c * 37 + y * 97) % 113;
            if (y < horizonY - 6 && starHash === 0) {
              charBuffer[idx] = '·';
              colorBuffer[idx] = '#7e93b8';
            } else if (y > horizonY - 4) {
              charBuffer[idx] = ' ';
              colorBuffer[idx] = '#101728'; // Horizon haze
            }
          }
        }
      }
    }

    /* ==========================================================================
       6. HIGH-PERFORMANCE MONOSPACE 2D CANVAS DRAW LOOP
       ========================================================================== */
    // Consecutive text spans with identical fillStyle are batched into a single
    // fillText call, dropping canvas draw calls from ~5000 down to ~200 per frame.
    function renderBufferToScreen() {
      ctx.fillStyle = '#060814';
      ctx.fillRect(0, 0, screenW, screenH);

      const fontSize = Math.floor(cellH * 0.95);
      ctx.font = `${fontSize}px monospace`;
      ctx.textBaseline = 'top';

      for (let r = 0; r < rows; r++) {
        const rowOffset = r * cols;
        const yPos = r * cellH;

        let curColor = '';
        let textBatch = '';
        let startCol = 0;

        for (let c = 0; c < cols; c++) {
          const idx = rowOffset + c;
          const char = charBuffer[idx] || ' ';
          const color = colorBuffer[idx] || '#060814';

          if (color === curColor) {
            textBatch += char;
          } else {
            if (textBatch.length > 0 && curColor !== '#060814') {
              ctx.fillStyle = curColor;
              ctx.fillText(textBatch, startCol * cellW, yPos);
            }
            curColor = color;
            textBatch = char;
            startCol = c;
          }
        }

        if (textBatch.length > 0 && curColor !== '#060814') {
          ctx.fillStyle = curColor;
          ctx.fillText(textBatch, startCol * cellW, yPos);
        }
      }
    }

    /* ==========================================================================
       7. CROSS-PLATFORM INPUT HANDLING (Touch & Desktop)
       ========================================================================== */
    const keys = {};
    const input = { moveX: 0, moveY: 0, sprint: false };

    // Keyboard Fallback
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.sprint = true;
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.sprint = false;
    });

    // Mouse Drag to Look Fallback
    let isMouseDown = false;
    let mouseLastX = 0, mouseLastY = 0;
    canvas.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isMouseDown = false; });
    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - mouseLastX;
      const dy = e.clientY - mouseLastY;
      player.yaw += dx * 0.005;
      player.pitch = Math.max(-0.45, Math.min(0.45, player.pitch - dy * 0.0035));
      mouseLastX = e.clientX;
      mouseLastY = e.clientY;
    });

    // Touch Joystick & Look Pad Configuration
    let joyTouchId = null;
    let joyBaseX = 0, joyBaseY = 0;
    let joyKnobX = 0, joyKnobY = 0;
    const JOY_MAX_RADIUS = 52.0;

    let lookTouchId = null;
    let lookLastX = 0, lookLastY = 0;

    // Multi-touch handler with strict default gesture suppression
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const halfW = window.innerWidth * 0.5;

      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.clientX < halfW && joyTouchId === null) {
          // Left screen half: initialize virtual analog joystick
          joyTouchId = touch.identifier;
          joyBaseX = touch.clientX;
          joyBaseY = touch.clientY;
          joyKnobX = touch.clientX;
          joyKnobY = touch.clientY;
        } else if (touch.clientX >= halfW && lookTouchId === null) {
          // Right screen half: initialize touch look surface
          lookTouchId = touch.identifier;
          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          const dx = touch.clientX - joyBaseX;
          const dy = touch.clientY - joyBaseY;
          const dist = Math.hypot(dx, dy);

          if (dist > JOY_MAX_RADIUS) {
            joyKnobX = joyBaseX + (dx / dist) * JOY_MAX_RADIUS;
            joyKnobY = joyBaseY + (dy / dist) * JOY_MAX_RADIUS;
          } else {
            joyKnobX = touch.clientX;
            joyKnobY = touch.clientY;
          }

          input.moveX = (joyKnobX - joyBaseX) / JOY_MAX_RADIUS;
          input.moveY = -(joyKnobY - joyBaseY) / JOY_MAX_RADIUS;
        } else if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lookLastX;
          const dy = touch.clientY - lookLastY;
          player.yaw += dx * 0.0065;
          player.pitch = Math.max(-0.45, Math.min(0.45, player.pitch - dy * 0.0045));
          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
        }
      }
    }, { passive: false });

    function handleTouchEnd(e) {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          joyTouchId = null;
          input.moveX = 0;
          input.moveY = 0;
        } else if (touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    }
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    // Render virtual joystick on canvas
    function drawVirtualJoystick() {
      if (joyTouchId === null) return;
      ctx.save();
      // Outer boundary ring
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.beginPath();
      ctx.arc(joyBaseX, joyBaseY, JOY_MAX_RADIUS, 0, Math.PI * 2);
      ctx.stroke();

      // Inner movable knob
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.arc(joyKnobX, joyKnobY, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    /* ==========================================================================
       8. PHYSICS, COLLISION & GAME LOOP (Delta-Time Normalized)
       ========================================================================== */
    function updatePhysics(dt) {
      // Gather keyboard input if not currently using touch joystick
      if (joyTouchId === null) {
        input.moveX = 0;
        input.moveY = 0;
        if (keys['KeyW'] || keys['ArrowUp']) input.moveY += 1.0;
        if (keys['KeyS'] || keys['ArrowDown']) input.moveY -= 1.0;
        if (keys['KeyA']) input.moveX -= 1.0;
        if (keys['KeyD']) input.moveX += 1.0;
        if (keys['KeyQ'] || keys['ArrowLeft']) player.yaw -= 1.8 * dt;
        if (keys['KeyE'] || keys['ArrowRight']) player.yaw += 1.8 * dt;
      }

      // Movement vector normalization
      let mx = input.moveX;
      let my = input.moveY;
      const mag = Math.hypot(mx, my);
      if (mag > 1.0) {
        mx /= mag;
        my /= mag;
      }

      // Compute speed with sprint & water drag modifiers
      let currentSpeed = player.speed * (input.sprint ? 1.6 : 1.0);
      const curGroundH = sampleTerrain(player.x, player.y);
      if (curGroundH < WATER_LEVEL) {
        currentSpeed *= 0.6; // Swimming drag penalty
      }

      // Camera orientation relative movement vectors
      const forwardX = Math.cos(player.yaw);
      const forwardY = Math.sin(player.yaw);
      const rightX = -Math.sin(player.yaw);
      const rightY = Math.cos(player.yaw);

      const vx = (forwardX * my + rightX * mx) * currentSpeed;
      const vy = (forwardY * my + rightY * mx) * currentSpeed;

      // Slope collision & steep cliff wall blocking
      const nextX = (player.x + vx * dt) & MAP_MASK;
      const nextY = (player.y + vy * dt) & MAP_MASK;
      const nextH = sampleTerrain(nextX, nextY);

      // Max climb step: prevents scaling sheer vertical cliffs (> 14 units jump)
      if (nextH - curGroundH < 14.0) {
        player.x = nextX;
        player.y = nextY;
      }

      // Elevation clamping with smooth spring damping
      const groundZ = Math.max(nextH, WATER_LEVEL);
      player.targetZ = groundZ + player.eyeHeight;
      player.z += (player.targetZ - player.z) * Math.min(1.0, dt * 10.0);
    }

    /* ==========================================================================
       9. RESPONSIVE RESIZING & DYNAMIC GRID RESOLUTION
       ========================================================================== */
    function resizeDisplay() {
      screenW = window.innerWidth;
      screenH = window.innerHeight;
      canvas.width = screenW;
      canvas.height = screenH;

      // Adapt grid density based on screen dimensions for crisp text & 60+ FPS
      cols = Math.min(128, Math.max(64, Math.floor(screenW / 9.5)));
      rows = Math.min(72, Math.max(38, Math.floor(screenH / 15.5)));

      cellW = screenW / cols;
      cellH = screenH / rows;

      charBuffer = new Array(cols * rows);
      colorBuffer = new Array(cols * rows);
    }
    window.addEventListener('resize', resizeDisplay);

    /* ==========================================================================
       10. HUD DISPLAY & MAIN ANIMATION LOOP
       ========================================================================== */
    const hudLeft = document.getElementById('hud-left');
    const hudCenter = document.getElementById('hud-center');
    const hudRight = document.getElementById('hud-right');
    const controlsHint = document.getElementById('controls-hint');

    let lastFrameTime = performance.now();
    let frameCounter = 0;
    let fpsTimer = 0;
    let currentFps = 60;

    // Direction headings
    const HEADINGS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

    function updateHUD(dt) {
      frameCounter++;
      fpsTimer += dt;
      if (fpsTimer >= 0.5) {
        currentFps = Math.round(frameCounter / fpsTimer);
        frameCounter = 0;
        fpsTimer = 0;
      }

      // Normalize yaw to heading [0, 360)
      let deg = ((player.yaw * 180.0 / Math.PI) + 90.0) % 360.0;
      if (deg < 0) deg += 360.0;
      const headingIdx = Math.round(deg / 45.0) % 8;

      hudLeft.textContent = `VOXEL-ASCII // FPS: ${currentFps}`;
      hudCenter.textContent = `HEADING: [ ${HEADINGS[headingIdx]} ] (${Math.floor(deg)}°)`;

      const altitudeMeters = Math.max(0, Math.floor(player.z - WATER_LEVEL));
      hudRight.textContent = `POS: (${Math.floor(player.x)}, ${Math.floor(player.y)}) | ALT: ${altitudeMeters}m`;
    }

    // Fade control guide out after 7 seconds
    setTimeout(() => {
      controlsHint.style.opacity = '0';
    }, 7000);

    function gameLoop(now) {
      const dt = Math.min((now - lastFrameTime) / 1000.0, 0.1); // Clamp delta time against large jumps
      lastFrameTime = now;

      updatePhysics(dt);
      renderRaycastScene(now * 0.001);
      renderBufferToScreen();
      drawVirtualJoystick();
      updateHUD(dt);

      requestAnimationFrame(gameLoop);
    }

    // Initialize environment and launch engine
    generateWorld();
    resizeDisplay();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
